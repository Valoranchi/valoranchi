name: Publish to itch.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.5.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.5.0)"
        required: true
        type: string

jobs:
  publish:
    name: Publish to itch.io
    runs-on: ubuntu-latest
    steps:
      - name: Validate BUTLER_API_KEY secret exists
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::BUTLER_API_KEY secret is missing or empty."
            exit 1
          fi

      - name: Create itch directory and download Windows executable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p itch
          gh release download "$TAG" --pattern "riotclient-win-x64.exe" --dir itch

      - name: Generate README.txt for itch package
        run: |
          cat << 'EOF' > itch/README.txt
Valoranchi - Riot Client & VALORANT Dashboard
=============================================

What is this:
Valoranchi is a lightweight desktop dashboard and local API server for VALORANT.
It lets you inspect your store, daily offers, night market, skin wishlist,
match history, MMR rating, and friends activity directly in your browser.

How to run:
Double-click riotclient-win-x64.exe.
It will automatically start the local server and open the dashboard in your default browser.
Keep the command window open while using the dashboard; close the window to stop.

Windows SmartScreen:
Because this executable is not yet code-signed with an expensive certificate,
Windows SmartScreen may show a warning:
Click "More info" -> "Run anyway".

Requirements:
VALORANT must be open on your PC so Valoranchi can read your local session.

Documentation & Source:
https://github.com/Valoranchi/valoranchi

Riot Games Disclaimer:
Valoranchi isn't endorsed by Riot Games and doesn't reflect the views or opinions
of Riot Games or anyone officially involved in producing or managing Riot Games
properties. Riot Games, and all associated properties are trademarks or registered
trademarks of Riot Games, Inc.
EOF

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip -d butler_bin
          chmod +x butler_bin/butler
          echo "$PWD/butler_bin" >> $GITHUB_PATH

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          USERVERSION="${TAG#v}"
          butler push itch matias-obezzi/valoranchi:windows --userversion "$USERVERSION"
