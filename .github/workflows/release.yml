name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"
        required: true
      notes:
        description: "Optional release notes"
        type: string
        required: false
        default: ""
      publish_only:
        description: "Publish the version already in package.json without bumping"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate NPM_TOKEN secret exists
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is missing or empty. Please configure NPM_TOKEN in repository secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the npm token can publish to the scope
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          WHO=$(npm whoami)
          echo "Publishing as $WHO"
          SCOPE=$(node -p "require('./package.json').name.split('/')[0]")
          if ! npm access list packages "$SCOPE" >/dev/null 2>&1 && ! npm org ls "${SCOPE#@}" >/dev/null 2>&1; then
            echo "::error::The token for $WHO cannot see the scope $SCOPE. Create the npm organization '${SCOPE#@}' (or use your user as the scope) and give the granular token Read and write on all packages of that scope."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate JSON schemas
        run: npm run schema

      - name: Verify schemas are committed
        run: git diff --exit-code -- schema

      - name: Verify package tarball
        run: npm pack --dry-run

      - name: Decide whether to bump or republish the current version
        id: mode
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          PUBLISH_ONLY="${{ inputs.publish_only }}"
          if [ "$PUBLISH_ONLY" != "true" ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null && ! npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "v$VERSION is tagged but not on npm: publishing it instead of bumping"
            PUBLISH_ONLY=true
          fi
          echo "publish_only=$PUBLISH_ONLY" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update changelog and extract release notes
        if: ${{ steps.mode.outputs.publish_only != 'true' }}
        run: |
          node scripts/release-notes.mjs --bump "${{ inputs.bump }}" --notes "${{ inputs.notes }}" --output RELEASE_NOTES.md
          git add CHANGELOG.md

      - name: Bump version and create tag
        if: ${{ steps.mode.outputs.publish_only != 'true' }}
        run: npm version ${{ inputs.bump }} --force -m "Release v%s"

      - name: Resolve the version being released
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes for an existing version
        if: ${{ steps.mode.outputs.publish_only == 'true' }}
        run: |
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const text = fs.readFileSync("CHANGELOG.md", "utf8");
            const start = text.indexOf("## [" + version + "]");
            if (start < 0) { fs.writeFileSync("RELEASE_NOTES.md", "Release v" + version); process.exit(0); }
            const rest = text.slice(text.indexOf("\n", start) + 1);
            const end = rest.search(/\n## \[/);
            fs.writeFileSync("RELEASE_NOTES.md", (end < 0 ? rest : rest.slice(0, end)).trim() + "\n");
          ' "${{ steps.version.outputs.version }}"

      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Push commit and tag
        if: ${{ steps.mode.outputs.publish_only != 'true' }}
        run: |
          git push origin main
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ${{ steps.version.outputs.tag }} >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists"
          else
            gh release create ${{ steps.version.outputs.tag }} --title "${{ steps.version.outputs.tag }}" --notes-file RELEASE_NOTES.md
          fi

  build-exe:
    name: Build Windows Executable
    needs: release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build executable
        run: npm run exe

      - name: Attach executable to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release.outputs.tag }} release/riotclient-win-x64.exe --clobber
